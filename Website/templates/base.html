<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="brand" href="{{ url_for('index') }}">✔ To-Do</a>
    {% if session.user_id %}
    <form method="post" action="{{ url_for('logout') }}" class="who">
      <span>Hi, {{ session.name }}</span>
      <button class="btn small ghost">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
